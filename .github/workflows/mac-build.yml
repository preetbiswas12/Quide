name: Build Quide for macOS (Intel + Apple Silicon)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [ x64, arm64 ]

    steps:
    - name: 📦 Checkout repo
      uses: actions/checkout@v3

    - name: 🧰 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: pnpm

    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: 📥 Install dependencies
      run: pnpm install --frozen-lockfile

    - name: 🛠 Build Quide.app for macOS ${{ matrix.arch }}
      run: |
        pnpm run dist -- --mac --dir --${{ matrix.arch }}

    - name: ⬆️ Upload Quide.app (${{ matrix.arch }})
      uses: actions/upload-artifact@v4
      with:
        name: Quide-mac-${{ matrix.arch }}
        path: dist/mac-${{ matrix.arch }}/Quide.app
